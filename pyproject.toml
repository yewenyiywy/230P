[project]
name = "newsalpha"
version = "0.1.0"
description = "230P: trading temporary mispricing after news, net of realistic costs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "pydantic>=2.6",
    "pyyaml>=6",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "scipy>=1.12",
    "exchange_calendars>=4.5",
    "requests>=2.31",
]

[project.optional-dependencies]
databento = ["databento>=0.40"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "types-requests", "types-PyYAML"]

[project.scripts]
newsalpha = "newsalpha.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/newsalpha"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # the formatter owns line length; long strings stay readable

[tool.ruff.lint.isort]
known-first-party = ["newsalpha"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
